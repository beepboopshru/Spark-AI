<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/x-icon" href="/public/favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spark | AI App Idea Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @keyframes float {
            0% {
                transform: translateY(0px) translateX(0px);
            }

            50% {
                transform: translateY(-20px) translateX(10px);
            }

            100% {
                transform: translateY(0px) translateX(0px);
            }
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            animation: float 10s ease-in-out infinite;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.95);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }
    </style>
</head>

<body
    class="bg-[#050505] text-white font-sans min-h-screen flex flex-col items-center justify-center overflow-x-hidden">

    <div class="blob w-96 h-96 bg-purple-600/30 top-[-10%] left-[-10%]"></div>
    <div class="blob w-[500px] h-[500px] bg-blue-600/20 bottom-[-10%] right-[-10%]" style="animation-delay: -5s;"></div>

    <main class="w-full max-w-3xl px-6 py-12 text-center relative z-10">
        <div class="mb-12">
            <div
                class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-purple-600 to-blue-500 mb-6 shadow-[0_0_30px_rgba(147,51,234,0.5)]">
                <i class="fas fa-lightbulb text-2xl text-white"></i>
            </div>
            <h1
                class="text-6xl font-black tracking-tighter mb-4 bg-clip-text text-transparent bg-gradient-to-b from-white to-gray-400">
                Spark AI
            </h1>
            <p class="text-gray-400 text-lg max-w-md mx-auto leading-relaxed">
                Stop staring at a blank screen. Generate your next million-dollar app idea in seconds.
            </p>
        </div>

        <div
            class="glass p-2 rounded-3xl flex items-center shadow-2xl mb-12 transform transition-all focus-within:scale-[1.02]">
            <input id="userInput" type="text" placeholder="Enter a niche (e.g. Sustainable Fashion)..."
                class="w-full bg-transparent border-none outline-none px-6 py-4 text-white placeholder-gray-500 text-lg">
            <button id="genBtn" onclick="generateIdea()"
                class="bg-white text-black font-bold px-8 py-4 rounded-2xl hover:bg-purple-400 transition-all flex items-center gap-2 active:scale-95">
                <span>Generate</span> <i class="fas fa-arrow-right text-sm"></i>
            </button>
        </div>

        <div id="loading" class="hidden py-10">
            <div class="flex flex-col items-center gap-4">
                <div class="w-12 h-12 border-4 border-purple-500/30 border-t-purple-500 rounded-full animate-spin">
                </div>
                <p class="text-gray-400 animate-pulse">Consulting the digital oracle...</p>
            </div>
        </div>

        <div id="resultCard" class="hidden glass p-8 rounded-[2.5rem] text-left animate-[scaleIn_0.4s_ease-out]">
            <div class="flex justify-between items-start mb-6">
                <span
                    class="text-xs font-bold uppercase tracking-[0.2em] text-purple-400 bg-purple-400/10 px-3 py-1 rounded-full">New
                    Concept</span>
                <button onclick="copyIdea()" class="text-gray-500 hover:text-white"><i class="far fa-copy"></i></button>
            </div>
            <h2 id="appName" class="text-3xl font-bold mb-3 text-white"></h2>
            <p id="appPitch" class="text-xl text-gray-300 font-light italic mb-8 border-l-2 border-purple-500 pl-4"></p>
            <div id="appFeatures" class="grid gap-4"></div>
        </div>
    </main>

    <footer class="mt-auto py-8 text-gray-600 text-[10px] tracking-[0.3em] uppercase">
        OpenRouter Engine &bull; Zero Latency &bull; 2026
    </footer>

    <script>
        async function generateIdea() {
            const userInput = document.getElementById('userInput').value;
            const loading = document.getElementById('loading');
            const resultCard = document.getElementById('resultCard');
            const genBtn = document.getElementById('genBtn');

            if (!userInput) return alert("Please enter a niche!");

            // UI State Change
            loading.classList.remove('hidden');
            resultCard.classList.add('hidden');
            genBtn.disabled = true;
            genBtn.style.opacity = "0.5";

            try {
                const response = await fetch("/api/generate", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ niche: userInput })
                });

                const data = await response.json();

                // Parse the AI content (Assuming your server sends the SDK response)
                const contentStr = data.choices[0].message.content;
                const content = JSON.parse(contentStr);

                // Update UI
                document.getElementById('appName').innerText = content.name;
                document.getElementById('appPitch').innerText = content.pitch;

                const featuresHtml = content.features.map(f => `
                    <div class="flex items-center gap-4 bg-white/5 p-4 rounded-2xl hover:bg-white/10 transition-colors">
                        <div class="w-2 h-2 rounded-full bg-purple-500"></div>
                        <span class="text-gray-300 text-sm font-medium">${f}</span>
                    </div>
                `).join('');

                document.getElementById('appFeatures').innerHTML = featuresHtml;

                loading.classList.add('hidden');
                resultCard.classList.remove('hidden');
            } catch (err) {
                console.error(err);
                alert("Failed to generate. Make sure server.js is running!");
            } finally {
                genBtn.disabled = false;
                genBtn.style.opacity = "1";
            }
        }

        function copyIdea() {
            const name = document.getElementById('appName').innerText;
            const pitch = document.getElementById('appPitch').innerText;
            navigator.clipboard.writeText(`${name}: ${pitch}`);
            alert("Copied to clipboard!");
        }
    </script>
</body>

</html>
